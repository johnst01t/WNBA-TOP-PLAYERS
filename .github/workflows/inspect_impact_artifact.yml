name: Inspect chronological impact artifact
on:
  push:
    branches: [chatgpt-wnba-data-update-20260724]
    paths:
      - '.github/workflows/inspect_impact_artifact.yml'
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-wnba-data-update-20260724
      - name: Download completed model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 30063719664 -n WNBA-2026-chronological-lineup-impact -D downloaded
      - name: Extract and summarize audit mismatches
        run: |
          mkdir -p extracted artifact_inspect
          unzip -q downloaded/WNBA_2026_Chronological_Lineup_Impact_CSVs.zip -d extracted
          python - <<'PY'
          import csv, json
          from pathlib import Path
          path = next(Path('extracted').rglob('game_reconstruction_audit.csv'))
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig')))
          mismatches=[]
          for r in rows:
              if abs(float(r['Stint Away Points'])-float(r['Final Away']))>1e-7 or abs(float(r['Stint Home Points'])-float(r['Final Home']))>1e-7 or int(float(r['Substitution Errors']))>0:
                  mismatches.append(r)
          out=Path('artifact_inspect')
          fields=list(rows[0])
          with (out/'mismatches.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(mismatches)
          summary={'rows':len(rows),'mismatches':len(mismatches),'first_mismatches':mismatches[:20]}
          (out/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Publish inspection by API
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; run=os.environ['RUN_ID']; branch='chatgpt-wnba-data-update-20260724'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def put(path,content,message):
              url=f'https://api.github.com/repos/{repo}/contents/{path}'
              sha=None
              try:
                  req=urllib.request.Request(url+'?ref='+urllib.parse.quote(branch),headers=headers)
                  with urllib.request.urlopen(req) as response: sha=json.load(response).get('sha')
              except urllib.error.HTTPError as exc:
                  if exc.code!=404: raise
              payload={'message':message,'content':base64.b64encode(content).decode(),'branch':branch}
              if sha: payload['sha']=sha
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='PUT',headers=headers)
              with urllib.request.urlopen(req) as response: print(path,response.status)
          for name in ['summary.json','mismatches.csv']:
              content=open('artifact_inspect/'+name,'rb').read()
              put(f'artifact_inspections/{run}/{name}',content,f'Publish artifact inspection {run} {name}')
              put(f'artifact_inspections/latest_{name}',content,f'Update latest artifact inspection {name}')
          put('artifact_inspections/latest_run.txt',(run+'\n').encode(),f'Update latest artifact inspection run {run}')
          PY
