name: WNBA Data and Chronological Impact Update
on:
  push:
    branches:
      - chatgpt-wnba-data-update-20260724
    paths-ignore:
      - update_status/**
      - impact_status/**
      - inspect_status/**
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-wnba-data-update-20260724
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Download missing 2026 WNBA games
        run: python tools/download_wnba_new_games.py --start-id 401857054 --end-id 401857091 --output-dir WNBA_2026_New_Games
      - name: Build strict chronological lineup impact
        run: python tools/build_chronological_lineup_impact.py --output-dir Chronological_Lineup_Impact
      - name: Archive outputs
        run: |
          zip -r WNBA_2026_New_Games_Through_401857091.zip WNBA_2026_New_Games
          zip -r WNBA_2026_Chronological_Lineup_Impact_CSVs.zip Chronological_Lineup_Impact
      - uses: actions/upload-artifact@v4
        with:
          name: WNBA-2026-new-games-through-401857091
          path: WNBA_2026_New_Games_Through_401857091.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: WNBA-2026-chronological-lineup-impact
          path: WNBA_2026_Chronological_Lineup_Impact_CSVs.zip
          retention-days: 7
      - name: Record run and audit
        run: |
          mkdir -p update_status impact_status
          printf '%s\n' '${{ github.run_id }}' > update_status/run_id.txt
          cp WNBA_2026_New_Games/audit.json update_status/audit.json
          printf '%s\n' '${{ github.run_id }}' > impact_status/run_id.txt
          cp Chronological_Lineup_Impact/audit.json impact_status/audit.json
          cp Chronological_Lineup_Impact/methodology.txt impact_status/methodology.txt
          head -n 21 Chronological_Lineup_Impact/player_game_impact.csv > impact_status/top20.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_status impact_status
          git commit -m 'Record WNBA chronological impact update [skip ci]'
          git push origin HEAD:chatgpt-wnba-data-update-20260724
