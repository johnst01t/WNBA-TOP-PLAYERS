name: Force build all-player wins workbook

on:
  push:
    branches: [chatgpt-wins-ranking-20260724]
    paths-ignore:
      - wins_ranking_run_id.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - name: Build workbook
        run: |
          cat > /tmp/build.py <<'PY'
          import pandas as pd
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.formatting.rule import ColorScaleRule, DataBarRule
          from openpyxl.worksheet.table import Table, TableStyleInfo

          df = pd.read_csv('data/wins_source_2026.csv')
          assert len(df) == 213, len(df)
          assert df['Player'].nunique() == 213
          points_per_win = 30.0
          df['Offensive Adjusted Points'] = df['Offence_per_40'] * df['Minutes'] / 40
          df['Defensive Adjusted Points'] = df['Defence_per_40'] * df['Minutes'] / 40
          df['Estimated Wins'] = df['Net_Adjusted_Points'] / points_per_win
          assert (df['Estimated Wins'] - df['Estimated_Wins_Source']).abs().max() < 1e-8
          df = df.sort_values(['Estimated Wins','Net_per_40','Minutes'], ascending=False).reset_index(drop=True)
          df.insert(0, 'Win Rank', range(1, 214))
          df = df.rename(columns={
              'Offence_per_40':'Offensive Impact / 40',
              'Defence_per_40':'Defensive Impact / 40',
              'Net_per_40':'Net Impact / 40',
              'Net_Adjusted_Points':'Net Adjusted Points',
              'Reliability':'Reliability %'
          })
          cols = ['Win Rank','Player','Team','Estimated Wins','Offensive Impact / 40','Defensive Impact / 40','Net Impact / 40','Games','Minutes','Offensive Adjusted Points','Defensive Adjusted Points','Net Adjusted Points','Reliability %']
          out = df[cols].copy()
          out.to_csv('WNBA_2026_ALL_PLAYERS_RANKED_BY_ESTIMATED_WINS.csv', index=False)

          wb = Workbook()
          ws = wb.active
          ws.title = 'ALL PLAYERS BY WINS'
          blue='1F4E78'; white='FFFFFF'; red='F8CBAD'; yellow='FFF2CC'; green='C6E0B4'
          for j,h in enumerate(cols,1):
              c=ws.cell(1,j,h); c.fill=PatternFill('solid',fgColor=blue); c.font=Font(color=white,bold=True); c.alignment=Alignment(horizontal='center',vertical='center',wrap_text=True)
          for i,row in enumerate(out.itertuples(index=False,name=None),2):
              for j,v in enumerate(row,1): ws.cell(i,j,v)
          ws.freeze_panes='D2'; ws.sheet_view.showGridLines=False; ws.row_dimensions[1].height=42
          widths=[10,25,12,15,19,19,16,10,13,24,24,20,15]
          for j,w in enumerate(widths,1): ws.column_dimensions[ws.cell(1,j).column_letter].width=w
          for r in range(2,215):
              ws.cell(r,4).number_format='0.000'
              for j in [5,6,7]: ws.cell(r,j).number_format='+0.000;-0.000;0.000'
              ws.cell(r,8).number_format='0'; ws.cell(r,9).number_format='0.0'
              for j in [10,11,12]: ws.cell(r,j).number_format='+0.00;-0.00;0.00'
              ws.cell(r,13).number_format='0.0%'
          ws.conditional_formatting.add('D2:D214',ColorScaleRule(start_type='min',start_color=red,mid_type='percentile',mid_value=50,mid_color=yellow,end_type='max',end_color=green))
          for col in ['E','F','G','J','K','L']:
              ws.conditional_formatting.add(f'{col}2:{col}214',ColorScaleRule(start_type='min',start_color=red,mid_type='num',mid_value=0,mid_color=yellow,end_type='max',end_color=green))
          ws.conditional_formatting.add('M2:M214',DataBarRule(start_type='num',start_value=0,end_type='num',end_value=1,color=blue))
          tab=Table(displayName='AllPlayersWinsRanking',ref='A1:M214'); tab.tableStyleInfo=TableStyleInfo(name='TableStyleMedium2',showRowStripes=True); ws.add_table(tab)

          notes=wb.create_sheet('METHOD')
          notes.append(['Measure','Definition'])
          notes.append(['Estimated Wins','Net Adjusted Points divided by 30.'])
          notes.append(['Net Adjusted Points','Net Impact / 40 multiplied by Minutes / 40.'])
          notes.append(['Offensive Impact / 40','Chronological lineup-adjusted offensive effect.'])
          notes.append(['Defensive Impact / 40','Chronological lineup-adjusted defensive effect; positive is better.'])
          notes.append(['Coverage','All 213 players from the source workbook.'])
          for c in notes[1]: c.fill=PatternFill('solid',fgColor=blue); c.font=Font(color=white,bold=True)
          notes.column_dimensions['A'].width=28; notes.column_dimensions['B'].width=90
          notes.sheet_view.showGridLines=False

          wb.save('WNBA_2026_ALL_PLAYERS_RANKED_BY_ESTIMATED_WINS.xlsx')
          print(out.head(15).to_string(index=False))
          PY
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: WNBA-2026-all-players-ranked-by-estimated-wins
          path: |
            WNBA_2026_ALL_PLAYERS_RANKED_BY_ESTIMATED_WINS.xlsx
            WNBA_2026_ALL_PLAYERS_RANKED_BY_ESTIMATED_WINS.csv
          retention-days: 7
      - name: Save run ID
        run: |
          echo "${{ github.run_id }}" > wins_ranking_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wins_ranking_run_id.txt
          git commit -m "Save wins ranking artifact run [skip ci]" || exit 0
          git push
